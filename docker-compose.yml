services:
  # Servizio Database PostgreSQL
  postgres:
    image: postgres:16
    container_name: bugboard-db
    environment:
      POSTGRES_DB: bugboard_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Servizio Frontend (Angular) 
  frontend:
    image: node:20-alpine
    container_name: bugboard-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules 
    ports:
      - "4200:4200"
    command: npm start -- --host 0.0.0.0 --poll 2000 #  necessario per hot-reload su Windows/Docker
    depends_on:
      - postgres

volumes:
  postgres_data: