server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gestione Routing Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy: gira le chiamate API al container del backend
    location /api/ {
        proxy_pass http://bugboard-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}