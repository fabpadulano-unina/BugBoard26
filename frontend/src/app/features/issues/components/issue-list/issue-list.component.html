<p-toast></p-toast>

<div class="card">
  <div class="flex justify-content-between align-items-center mb-4">
    <h2 class="m-0 text-900">Dashboard Issue</h2>
    <p-button label="Nuova Issue" icon="pi pi-plus" routerLink="/issues/new"></p-button>
  </div>

  <p-table 
    #dt1
    [value]="issues()" 
    [globalFilterFields]="['title', 'description', 'priority', 'state', 'type', 'assigneeName']"
    [paginator]="true"
    [rows]="10"
    [tableStyle]="{ 'min-width': '60rem' }"
    styleClass="p-datatable-sm shadow-2 gridlines">

    <ng-template pTemplate="caption">
        <div class="flex justify-content-end">
            <p-iconField iconPosition="left">
                <p-inputIcon><i class="pi pi-search"></i></p-inputIcon>
                <input pInputText type="text" (input)="dt1.filterGlobal($any($event.target).value, 'contains')" placeholder="Cerca..." />
            </p-iconField>
        </div>
    </ng-template>

    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="id" style="width:5%">ID <p-sortIcon field="id"></p-sortIcon></th>
        
        <th pSortableColumn="title" style="width:25%">
            Titolo <p-sortIcon field="title"></p-sortIcon>
        </th>

        <th pSortableColumn="priority" style="width:10%">
            Priorità <p-sortIcon field="priority"></p-sortIcon>
            <p-columnFilter type="text" field="priority" display="menu"></p-columnFilter>
        </th>

        <th pSortableColumn="state" style="width:15%">
            Stato <p-sortIcon field="state"></p-sortIcon>
            <p-columnFilter field="state" matchMode="equals" display="menu">
                <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                    <p-dropdown [ngModel]="value" [options]="stateOptions" (onChange)="filter($event.value)" placeholder="Tutti" [showClear]="true">
                         <ng-template let-option pTemplate="item">
                            <p-tag [value]="option.label" [severity]="getSeverity(option.label)"></p-tag>
                        </ng-template>
                    </p-dropdown>
                </ng-template>
            </p-columnFilter>
        </th>

        <th pSortableColumn="assigneeName" style="width:15%">Assegnatario <p-sortIcon field="assigneeName"></p-sortIcon></th>
        <th style="width:15%">Reporter</th>
        <th style="width:5%"></th> </tr>
    </ng-template>
    
    <ng-template pTemplate="body" let-issue>
      <tr>
        <td>{{ issue.id }}</td>
        <td class="font-bold">{{ issue.title }}</td>
        
        <td><p-tag [value]="issue.priority" [severity]="getPrioritySeverity(issue.priority)"></p-tag></td>

        <td>
           <p-dropdown [options]="stateOptions" [(ngModel)]="issue.state" (onChange)="onStateChange(issue, $event.value)" 
                       [disabled]="!canEdit(issue)" appendTo="body" [style]="{'width':'100%'}">
                <ng-template pTemplate="selectedItem" let-sel><p-tag [value]="sel.label" [severity]="getSeverity(sel.label)"></p-tag></ng-template>
                <ng-template let-opt pTemplate="item"><p-tag [value]="opt.label" [severity]="getSeverity(opt.label)"></p-tag></ng-template>
           </p-dropdown>
        </td>

        <td>{{ issue.assigneeName || '-' }}</td>
        <td>{{ issue.reporterName }}</td>
        
        <td>
            <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" 
                      [routerLink]="['/issues/edit', issue.id]" 
                      pTooltip="Modifica Dettagli"
                      [disabled]="!canEdit(issue)">
            </p-button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
