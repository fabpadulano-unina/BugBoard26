app:
  default-password: password123

spring:
  application:
    name: bugboard-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/bugboard_db
    username: admin
    password: ${app.default-password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:tuamail@gmail.com}
    password: ${MAIL_PASSWORD:tuapassword}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true