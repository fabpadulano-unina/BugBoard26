spring:
  application:
    name: bugboard-backend
  datasource:
    # Se la variabile DB_HOST esiste usa quella, altrimenti usa localhost
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/bugboard_db
    username: admin
    password: password123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # Crea le tabelle da solo
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect